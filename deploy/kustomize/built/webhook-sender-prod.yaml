apiVersion: v1
data:
  LOG_LEVEL: info
  QUEUE_HOST: tracking-rabbitmq.tracking
  SIGNING_ALGORITHM: hmac-sha256
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: webhook-sender
    app.kubernetes.io/part-of: parcelpoint
  name: webhook-config-5t8f2k9m4c
  namespace: webhooks
---
apiVersion: v1
data:
  QUEUE_PASSWORD: cmVwbGFjZWQtYnktdGhlLWRlcGxveS1qb2I=
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: webhook-sender
    app.kubernetes.io/part-of: parcelpoint
  name: webhook-queue-b7h4d2g9t6
  namespace: webhooks
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: webhook-sender
    app.kubernetes.io/part-of: parcelpoint
  name: webhook-sender
  namespace: webhooks
spec:
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
  selector:
    app: webhook-sender
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: webhook-sender
    app.kubernetes.io/part-of: parcelpoint
  name: webhook-sender
  namespace: webhooks
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webhook-sender
  template:
    metadata:
      labels:
        app: webhook-sender
    spec:
      containers:
      - env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4317
        envFrom:
        - configMapRef:
            name: webhook-config-5t8f2k9m4c
        - secretRef:
            name: webhook-queue-b7h4d2g9t6
        image: ghcr.io/parcelpoint/webhook-sender:1.3.0
        name: sender
        ports:
        - containerPort: 9090
          name: metrics
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: webhook-sender
    app.kubernetes.io/part-of: parcelpoint
  name: webhook-redeliver
  namespace: webhooks
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - args:
            - redeliver
            - --older-than=10m
            envFrom:
            - configMapRef:
                name: webhook-config-5t8f2k9m4c
            - secretRef:
                name: webhook-queue-b7h4d2g9t6
            image: ghcr.io/parcelpoint/webhook-sender:1.3.0
            name: redeliver
          restartPolicy: OnFailure
  schedule: '*/10 * * * *'
