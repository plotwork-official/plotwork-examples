apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app.kubernetes.io/part-of: parcelpoint
    app.kubernetes.io/name: webhook-sender
resources:
- deployment.yaml
- service.yaml
configMapGenerator:
- name: webhook-config
  literals:
  - LOG_LEVEL=info
  - QUEUE_HOST=tracking-rabbitmq.tracking
  - SIGNING_ALGORITHM=hmac-sha256
secretGenerator:
- name: webhook-queue
  envs:
  - queue.env
