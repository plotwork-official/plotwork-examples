      app.kubernetes.io/name: tracking
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: tracking
        app.kubernetes.io/name: tracking
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "ghcr.io/parcelpoint/tracking-api:1.8.2"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tracking-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracking-postgresql
                  key: password
