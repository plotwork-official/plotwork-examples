# Source: tracking/charts/postgresql/templates/primary/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tracking-postgresql
  namespace: tracking
  labels:
    app.kubernetes.io/instance: tracking
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: 16.4.0
    helm.sh/chart: postgresql-15.5.20
    app.kubernetes.io/component: primary
spec:
  replicas: 1
  serviceName: tracking-postgresql-hl
  selector:
    matchLabels:
      app.kubernetes.io/instance: tracking
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: tracking
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: primary
    spec:
      containers:
        - name: postgresql
          image: docker.io/bitnami/postgresql:16.4.0-debian-12-r0
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DATABASE
              value: tracking
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracking-postgresql
                  key: password
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
