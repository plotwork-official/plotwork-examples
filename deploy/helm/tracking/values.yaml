# The tracking release's values. The cache is off until the API reads parcels from it.
api:
  replicaCount: 2
  image:
    repository: ghcr.io/parcelpoint/tracking-api
    tag: 1.8.2
  ingress:
    host: api.parcelpoint.example

worker:
  replicaCount: 1
  image:
    repository: ghcr.io/parcelpoint/event-worker
    tag: 1.8.2

postgresql:
  auth:
    database: tracking
    username: tracking
  primary:
    persistence:
      size: 20Gi

rabbitmq:
  enabled: true
  auth:
    username: tracking

cache:
  enabled: false
  architecture: standalone
