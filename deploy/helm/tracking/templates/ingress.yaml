apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "parcelpoint.fullname" . }}
  labels:
    {{- include "parcelpoint.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "parcelpoint.fullname" . }}-api
                port:
                  number: 80
