apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: merchant-dashboard
  title: Merchant dashboard
  description: Where a merchant creates shipments and prints labels.
  tags: [react]
spec:
  type: website
  lifecycle: production
  owner: team-integrations
  system: merchant-integrations
  consumesApis: [tracking-rest]
