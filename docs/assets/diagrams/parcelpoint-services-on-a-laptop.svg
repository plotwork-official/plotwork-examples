<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 536" width="936" height="536" role="img" aria-labelledby="parcelpoint-services-on-a-laptop-title parcelpoint-services-on-a-laptop-desc" aria-description="Parcelpoint services on a laptop: 6 nodes, 6 connections. The 5 services of a Docker Compose file in 2 networks, with 1 named volume. Each arrow points from a service to one it depends on." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="light"><title id="parcelpoint-services-on-a-laptop-title">Parcelpoint services on a laptop</title><desc id="parcelpoint-services-on-a-laptop-desc">Parcelpoint services on a laptop: 6 nodes, 6 connections. The 5 services of a Docker Compose file in 2 networks, with 1 named volume. Each arrow points from a service to one it depends on.
Nodes:
- tracking-data (Named volume), storage
- Virtual network: edge
  - web (build ./web, port 3000), service
  - api (ghcr.io/parcelpoint/tracking-api:1.8.2, port 8080), service
- Virtual network: data
  - worker (ghcr.io/parcelpoint/event-worker:1.8.2), service
  - db (postgres:16-alpine), database
  - queue (rabbitmq:3.13-management), queue
Connections:
- web to api
- api to db
- api to queue
- worker to db
- worker to queue
- db to tracking-data (stored data line): mounts</desc><metadata data-format="buun-diagram"># Generated by plotwork generate from the source services (compose: compose.yaml).
# The next run writes over this file. Put changes in docs/architecture.services.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
flow "Parcelpoint services on a laptop" direction=down desc="The 5 services of a Docker Compose file in 2 networks, with 1 named volume. Each arrow points from a service to one it depends on."

node tracking_data_volume storage "tracking-data" sub="Named volume"

group edge_net "edge" type=network {
  node web service "web" sub="build ./web, port 3000"
  node api service "api" sub="ghcr.io/parcelpoint/tracking-api:1.8.2, port 8080"
}

group data_net "data" type=network {
  node worker service "worker" sub="ghcr.io/parcelpoint/event-worker:1.8.2" icon=lucide:server
  node db_1 database "db" sub="postgres:16-alpine" icon=simple:postgresql
  node queue queue "queue" sub="rabbitmq:3.13-management" icon=simple:rabbitmq
}

web -&gt; api
api -&gt; db_1
api -&gt; queue
worker -&gt; db_1
worker -&gt; queue
db_1 -&gt; tracking_data_volume : "mounts" icon=lucide:hard-drive role=data</metadata><defs><filter id="parcelpoint-services-on-a-laptop-lift" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05"/><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" result="lifted"/><feOffset in="SourceAlpha" dy="1" result="below"/><feComposite in="SourceAlpha" in2="below" operator="out" result="edge"/><feFlood flood-color="#ffffff" flood-opacity="0"/><feComposite in2="edge" operator="in" result="rim"/><feMerge><feMergeNode in="lifted"/><feMergeNode in="rim"/></feMerge></filter></defs><g data-group="edge_net" data-group-type="network" data-frame="dashed" data-depth="0"><rect x="24" y="24" width="322" height="232" rx="16" fill="#e8edf1" stroke="#76a0d0" stroke-width="1" stroke-dasharray="6 5"/></g><g data-group="data_net" data-group-type="network" data-frame="dashed" data-depth="0"><rect x="402" y="35" width="510" height="216" rx="16" fill="#e8edf1" stroke="#76a0d0" stroke-width="1" stroke-dasharray="6 5"/></g><g data-edge="e0" data-from="web" data-to="api"><path d="M185 132L185 152" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180.5 144.25L185 151.25L189.5 144.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e1" data-from="api" data-to="db_1"><path d="M326 197L422 197" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M414.25 201.5L421.25 197L414.25 192.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e2" data-from="api" data-to="queue"><path d="M185 236L185 478Q185 488 195 488L769.5 488Q779.5 488 779.5 478L779.5 231" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round"