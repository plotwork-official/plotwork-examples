flow "The label service's Azure pipeline" direction=down desc="6 jobs in 3 stages, 2 of which deploy to an environment, in the order dependsOn sets. A dashed arrow reaches a job that runs only when its condition holds. Imported from Azure Pipelines."

node pipeline terminal "Pipeline starts"

group stage_build "Build and test" type=ci-cd {
  node test step "Unit tests" sub="2 matrix runs, ubuntu-24.04, 3 steps"
  node synth step "Synthesize the cloud assembly" sub="ubuntu-24.04, 4 steps"
  node audit step "Licence and vulnerability audit" sub="when its condition holds, ubuntu-24.04, 1 step"
}

group stage_staging "Deploy to staging" type=ci-cd {
  node deploy_staging step "cdk deploy" sub="when its condition holds, deploys to labels-staging, ubuntu-24.04, 2 steps"
  node smoke step "Print a test label" sub="when its condition holds, ubuntu-24.04, 1 step"
}

group stage_production "Deploy to production" type=ci-cd {
  node deploy_production step "cdk deploy" sub="deploys to labels-production, ubuntu-24.04, 3 steps"
}

test -&gt; synth
pipeline -&gt; test
pipeline --&gt; audit
deploy_staging --&gt; smoke
synth --&gt; deploy_staging
audit --&gt; deploy_staging
smoke -&gt; deploy_production
