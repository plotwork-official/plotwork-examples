<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 626 941" width="626" height="941" role="img" aria-labelledby="dg-title dg-desc" aria-description="The label service's Azure pipeline: 7 nodes, 7 connections. 6 jobs in 3 stages, 2 of which deploy to an environment, in the order dependsOn sets. A dashed arrow reaches a job that runs only when its condition holds. Imported from Azure Pipelines." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="auto"><title id="dg-title">The label service's Azure pipeline</title><desc id="dg-desc">The label service's Azure pipeline: 7 nodes, 7 connections. 6 jobs in 3 stages, 2 of which deploy to an environment, in the order dependsOn sets. A dashed arrow reaches a job that runs only when its condition holds. Imported from Azure Pipelines.
Nodes:
- Pipeline starts, terminal
- CI and CD: Build and test
  - Unit tests (2 matrix runs, ubuntu-24.04, 3 steps), step
  - Synthesize the cloud assembly (ubuntu-24.04, 4 steps), step
  - Licence and vulnerability audit (when its condition holds, ubuntu-24.04, 1 step), step
- CI and CD: Deploy to staging
  - cdk deploy (when its condition holds, deploys to labels-staging, ubuntu-24.04, 2 steps), step
  - Print a test label (when its condition holds, ubuntu-24.04, 1 step), step
- CI and CD: Deploy to production
  - cdk deploy (deploys to labels-production, ubuntu-24.04, 3 steps), step
Connections:
- Unit tests to Synthesize the cloud assembly
- Pipeline starts to Unit tests
- Pipeline starts to Licence and vulnerability audit (dashed)
- cdk deploy to Print a test label (dashed)
- Synthesize the cloud assembly to cdk deploy (dashed)
- Licence and vulnerability audit to cdk deploy (dashed)
- Print a test label to cdk deploy</desc><style>.dg-s0{fill:#eae9ee;stroke:#877eb6}.dg-s1{fill:#eae9ee}.dg-s2{stroke:#4a3aa7}.dg-s3{fill:#171716}.dg-s4{fill:#ffffff;stroke:#dad9d2;filter:url(#dg-lift)}.dg-s5{fill:#52514e}.dg-s6{fill:#ffffff;filter:url(#dg-lift)}@media (prefers-color-scheme:dark){svg:not([data-scheme="light"]) .dg-s0{fill:#1f1f25;stroke:#6e689d}svg:not([data-scheme="light"]) .dg-s1{fill:#1f1f25}svg:not([data-scheme="light"]) .dg-s2{stroke:#9085e9}svg:not([data-scheme="light"]) .dg-s3{fill:#f3f2ee}svg:not([data-scheme="light"]) .dg-s4{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg:not([data-scheme="light"]) .dg-s5{fill:#c3c2b7}svg:not([data-scheme="light"]) .dg-s6{fill:#1f1f1d;filter:url(#dg-lift-dark)}}svg[data-scheme="dark"] .dg-s0{fill:#1f1f25;stroke:#6e689d}svg[data-scheme="dark"] .dg-s1{fill:#1f1f25}svg[data-scheme="dark"] .dg-s2{stroke:#9085e9}svg[data-scheme="dark"] .dg-s3{fill:#f3f2ee}svg[data-scheme="dark"] .dg-s4{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg[data-scheme="dark"] .dg-s5{fill:#c3c2b7}svg[data-scheme="dark"] .dg-s6{fill:#1f1f1d;filter:url(#dg-lift-dark)}</style><metadata data-format="buun-diagram"># Generated by plotwork generate from the source ci-azure (azure-pipelines: pipelines/azure/azure-pipelines.yml).
