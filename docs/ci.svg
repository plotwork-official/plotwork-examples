<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 643 363" width="643" height="363" role="img" aria-labelledby="dg-title dg-desc" aria-description="Pull request checks: 4 nodes, 3 connections. 2 jobs and their steps of the check workflow, started by a pull request or a push to main, in the order their needs set, imported from GitHub Actions." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="light"><title id="dg-title">Pull request checks</title><desc id="dg-desc">Pull request checks: 4 nodes, 3 connections. 2 jobs and their steps of the check workflow, started by a pull request or a push to main, in the order their needs set, imported from GitHub Actions.
Nodes:
- Pull request or push, terminal
- Group: Generated diagrams match their files (Calls plotwork.yml)
  - Generated diagrams match their files (Calls plotwork.yml), step
- Group: Hand-written diagrams are valid and drawn (ubuntu-latest)
  - Checkout, step
  - Plotwork official plotwork, step
Connections:
- Pull request or push to Generated diagrams match their files
- Pull request or push to Checkout
- Checkout to Plotwork official plotwork</desc><metadata data-format="buun-diagram"># Generated by plotwork generate from the source ci (github-actions: .github/workflows/check.yml).
# The next run writes over this file. Put changes in docs/ci.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
flow "Pull request checks" direction=down desc="2 jobs and their steps of the check workflow, started by a pull request or a push to main, in the order their needs set, imported from GitHub Actions."

node on terminal "Pull request or push"

group job_generated "Generated diagrams match their files" sub="Calls plotwork.yml" {
  node generated step "Generated diagrams match their files" sub="Calls plotwork.yml"
}

group job_diagrams "Hand-written diagrams are valid and drawn" sub="ubuntu-latest" {
  node diagrams_1 step "Checkout" icon=lucide:git-branch
  node diagrams_2 step "Plotwork official plotwork"
}

on -&gt; generated
on -&gt; diagrams_1
diagrams_1 -&gt; diagrams_2
