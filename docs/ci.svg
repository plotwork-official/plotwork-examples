<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 623 363" width="623" height="363" role="img" aria-labelledby="dg-title dg-desc" aria-description="Pull request checks: 5 nodes, 4 connections. 2 jobs and their steps of the check workflow, started by a pull request or a push to main, in the order their needs set, imported from GitHub Actions." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="light"><title id="dg-title">Pull request checks</title><desc id="dg-desc">Pull request checks: 5 nodes, 4 connections. 2 jobs and their steps of the check workflow, started by a pull request or a push to main, in the order their needs set, imported from GitHub Actions.
Nodes:
- Pull request or push, terminal
- Group: Generated diagrams match their files (ubuntu-latest)
  - Checkout, step
  - Plotwork official plotwork, step
- Group: Hand-written diagrams are valid and drawn (ubuntu-latest)
  - Checkout, step
  - Plotwork official plotwork, step
Connections:
- Pull request or push to Checkout
- Pull request or push to Checkout
- Checkout to Plotwork official plotwork
- Checkout to Plotwork official plotwork</desc><metadata data-format="buun-diagram"># Generated by plotwork generate from the source ci (github-actions: .github/workflows/check.yml).
# The next run writes over this file. Put changes in docs/ci.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
flow "Pull request checks" direction=down desc="2 jobs and their steps of the check workflow, started by a pull request or a push to main, in the order their needs set, imported from GitHub Actions."

node on terminal "Pull request or push"

group job_generated "Generated diagrams match their files" sub="ubuntu-latest" {
  node generated_1 step "Checkout" icon=lucide:git-branch
  node generated_2 step "Plotwork official plotwork"
}

group job_diagrams "Hand-written diagrams are valid and drawn" sub="ubuntu-latest" {
  node diagrams_1 step "Checkout" icon=lucide:git-branch
  node diagrams_2 step "Plotwork official plotwork"
}

on -&gt; generated_1
on -&gt; diagrams_1
generated_1 -&gt; generated_2
diagrams_1 -&gt; diagrams_2
</metadata><defs><filter id="dg-lift" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05"/><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" result="lifted"/><feOffset in="SourceAlpha" dy="1" result="below"/><feComposite in="SourceAlpha" in2="below" operator="out" result="edge"/><feFlood flood-color="#ffffff" flood-opacity="0"/><feComposite in2="edge" operator="in" result="rim"/><feMerge><feMergeNode in="lifted"/><feMergeNode in="rim"/></feMerge></filter></defs><g data-group="job_generated" data-frame="solid" data-depth="0"><rect x="24" y="129" width="255" height="210" rx="16" fill="#f6f6f3" stroke="#d2d1c9" stroke-width="1"/></g><g data-group="job_diagrams" data-frame="solid" data-depth="0"><rect x="307" y="129" width="292" height="210" rx="16" fill="#f6f6f3" stroke="#d2d1c9" stroke-width="1"/></g><g data-edge="e0" data-from="on" data-to="generated_1"><path d="M254 60L254 70Q254 80 244 80L151 80Q141 80 141 90L141 187" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M136.5 179.25L141 186.25L145.5 179.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e1" data-from="on" data-to="diagrams_1"><path d="M310 60L310 70Q310 80 320 80L414 80Q424 80 424 90L424 187" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M419.5 179.25L424 186.25L428.5 179.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e2" data-from="generated_1" data-to="generated_2"><path d="M141 243L141 263" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M136.5 255.25L141 262.25L145.5 255.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e3" data-from="diagrams_1" data-to="diagrams_2"><path d="M424 243L424 263" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M419.5 255.25L424 262.25L428.5 255.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-group-tab="job_generated"><path d="M25 145 A15 15 0 0 1 40 130 L262 130 L262 166 A8 8 0 0 1 254 174 L25 174 Z" fill="#f6f6f3"/><text x="36" y="147.37" font-size="12" font-weight="600" fill="#171716" textLength="214.65" lengthAdjust="spacingAndGlyphs">Generated diagrams match their files</text><text x="36" y="164.37" font-size="12" font-weight="400" fill="#52514e" textLength="76" lengthAdjust="spacingAndGlyphs">ubuntu-latest</text></g><g data-group-tab="job_diagrams"><path d="M308 145 A15 15 0 0 1 323 130 L582 130 L582 166 A8 8 0 0 1 574 174 L308 174 Z" fill="#f6f6f3"/><text x="319" y="147.37" font-size="12" font-weight="600" fill="#171716" textLength="251.06" lengthAdjust="spacingAndGlyphs">Hand-written diagrams are valid and drawn</text><text x="319" y="164.37" font-size="12" font-weight="400" fill="#52514e" textLength="76" lengthAdjust="spacingAndGlyphs">ubuntu-latest</text></g><g data-node="generated_1" data-type="step"><rect x="76" y="187" width="129" height="56" rx="12" fill="#ffffff" stroke="#dad9d2" stroke-width="1" filter="url(#dg-lift)"/><rect x="90" y="201" width="28" height="28" rx="8" fill="#eaeaea"/><g transform="translate(96 207) scale(0.67)" aria-hidden="true" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></g><text x="128" y="219.73" font-size="13" font-weight="600" fill="#171716" textLength="60.66" lengthAdjust="spacingAndGlyphs">Checkout</text></g><g data-node="generated_2" data-type="step"><rect x="44" y="263" width="193" height="56" rx="12" fill="#ffffff" stroke="#dad9d2" stroke-width="1" filter="url(#dg-lift)"/><text x="60" y="295.73" font-size="13" font-weight="600" fill="#171716" textLength="160.91" lengthAdjust="spacingAndGlyphs">Plotwork official plotwork</text></g><g data-node="diagrams_1" data-type="step"><rect x="359" y="187" width="129" height="56" rx="12" fill="#ffffff" stroke="#dad9d2" stroke-width="1" filter="url(#dg-lift)"/><rect x="373" y="201" width="28" height="28" rx="8" fill="#eaeaea"/><g transform="translate(379 207) scale(0.67)" aria-hidden="true" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></g><text x="411" y="219.73" font-size="13" font-weight="600" fill="#171716" textLength="60.66" lengthAdjust="spacingAndGlyphs">Checkout</text></g><g data-node="diagrams_2" data-type="step"><rect x="327" y="263" width="193" height="56" rx="12" fill="#ffffff" stroke="#dad9d2" stroke-width="1" filter="url(#dg-lift)"/><text x="343" y="295.73" font-size="13" font-weight="600" fill="#171716" textLength="160.91" lengthAdjust="spacingAndGlyphs">Plotwork official plotwork</text></g><g data-node="on" data-type="terminal"><rect x="197" y="24" width="170" height="36" rx="18" fill="#ffffff" stroke="#898781" stroke-width="1" filter="url(#dg-lift)"/><text x="282" y="46.73" font-size="13" font-weight="600" fill="#171716" text-anchor="middle" textLength="125.56" lengthAdjust="spacingAndGlyphs">Pull request or push</text></g></svg>