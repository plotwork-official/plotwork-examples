<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372" role="img" aria-labelledby="dg-title dg-desc" aria-description="The webhook sender in production, from kustomize build: 4 nodes, 4 connections. 2 workloads and 2 objects around them, imported from the output of kustomize build. Solid arrows are calls to a Service, and dashed arrows are configuration the pods read." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="auto"><title id="dg-title">The webhook sender in production, from kustomize build</title><desc id="dg-desc">The webhook sender in production, from kustomize build: 4 nodes, 4 connections. 2 workloads and 2 objects around them, imported from the output of kustomize build. Solid arrows are calls to a Service, and dashed arrows are configuration the pods read.
Nodes:
- webhook-sender (Deployment, 3 replicas, port 9090), service
- webhook-redeliver (CronJob), function
- webhook-config (ConfigMap), storage
- webhook-queue (Secret), secret
Connections:
- webhook-sender to webhook-config (dashed): reads
- webhook-sender to webhook-queue (dashed, identity line): reads
- webhook-redeliver to webhook-config (dashed): reads
- webhook-redeliver to webhook-queue (dashed, identity line): reads</desc><style>.dg-s0{stroke:#4a3aa7}.dg-s1{fill:#ffffff;stroke:#dad9d2;filter:url(#dg-lift)}.dg-s2{fill:#e5effa}.dg-s3{stroke:#2a78d6}.dg-s4{fill:#171716}.dg-s5{fill:#52514e}.dg-s6{fill:#e4f5ef}.dg-s7{stroke:#189e6e}.dg-s8{fill:#fce9e9}.dg-s9{stroke:#e34948}.dg-s10{fill:#ffffff;stroke:#dad9d2}.dg-s11{stroke:#52514e}.dg-s12{fill:#ffffff;stroke:#4a3aa7}@media (prefers-color-scheme:dark){svg:not([data-scheme="light"]) .dg-s0{stroke:#9085e9}svg:not([data-scheme="light"]) .dg-s1{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg:not([data-scheme="light"]) .dg-s2{fill:#243445}svg:not([data-scheme="light"]) .dg-s3{stroke:#3987e5}svg:not([data-scheme="light"]) .dg-s4{fill:#f3f2ee}svg:not([data-scheme="light"]) .dg-s5{fill:#c3c2b7}svg:not([data-scheme="light"]) .dg-s6{fill:#1e382e}svg:not([data-scheme="light"]) .dg-s7{stroke:#199e70}svg:not([data-scheme="light"]) .dg-s8{fill:#472d2c}svg:not([data-scheme="light"]) .dg-s9{stroke:#e66767}svg:not([data-scheme="light"]) .dg-s10{fill:#1f1f1d;stroke:#3a3a37}svg:not([data-scheme="light"]) .dg-s11{stroke:#c3c2b7}svg:not([data-scheme="light"]) .dg-s12{fill:#1f1f1d;stroke:#9085e9}}svg[data-scheme="dark"] .dg-s0{stroke:#9085e9}svg[data-scheme="dark"] .dg-s1{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg[data-scheme="dark"] .dg-s2{fill:#243445}svg[data-scheme="dark"] .dg-s3{stroke:#3987e5}svg[data-scheme="dark"] .dg-s4{fill:#f3f2ee}svg[data-scheme="dark"] .dg-s5{fill:#c3c2b7}svg[data-scheme="dark"] .dg-s6{fill:#1e382e}svg[data-scheme="dark"] .dg-s7{stroke:#199e70}svg[data-scheme="dark"] .dg-s8{fill:#472d2c}svg[data-scheme="dark"] .dg-s9{stroke:#e66767}svg[data-scheme="dark"] .dg-s10{fill:#1f1f1d;stroke:#3a3a37}svg[data-scheme="dark"] .dg-s11{stroke:#c3c2b7}svg[data-scheme="dark"] .dg-s12{fill:#1f1f1d;stroke:#9085e9}</style><metadata data-format="buun-diagram"># Generated by plotwork generate from the source kustomize-prod (kustomize: deploy/kustomize/built/webhook-sender-prod.yaml).
# The next run writes over this file. Put changes in docs/kustomize-prod.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
flow "The webhook sender in production, from kustomize build" direction=down desc="2 workloads and 2 objects around them, imported from the output of kustomize build. Solid arrows are calls to a Service, and dashed arrows are configuration the pods read."

node webhook_sender service "webhook-sender" sub="Deployment, 3 replicas, port 9090"
node webhook_redeliver function "webhook-redeliver" sub="CronJob" icon=lucide:calendar-clock
node webhook_config storage "webhook-config" sub="ConfigMap" icon=lucide:settings-2
node webhook_queue secret "webhook-queue" sub="Secret" icon=lucide:key-round

webhook_sender --&gt; webhook_config : "reads" icon=lucide:eye
webhook_sender --&gt; webhook_queue : "reads" icon=lucide:key-round role=identity
webhook_redeliver --&gt; webhook_config : "reads" icon=lucide:eye
webhook_redeliver --&gt; webhook_queue : "reads" icon=lucide:key-round role=identity
