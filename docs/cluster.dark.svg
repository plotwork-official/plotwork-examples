<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1131 360" width="1131" height="360" role="img" aria-labelledby="dg-title dg-desc" aria-description="Parcelpoint on Kubernetes: 7 nodes, 6 connections. 3 workloads and 4 objects around them, imported from Kubernetes manifests. Traffic flows from each Ingress to the pods behind its Services, and dashed arrows are configuration the pods read." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="dark"><title id="dg-title">Parcelpoint on Kubernetes</title><desc id="dg-desc">Parcelpoint on Kubernetes: 7 nodes, 6 connections. 3 workloads and 4 objects around them, imported from Kubernetes manifests. Traffic flows from each Ingress to the pods behind its Services, and dashed arrows are configuration the pods read.
Nodes:
- tracking (Ingress, api.parcelpoint.example), gateway
- tracking-api (Deployment, 2 replicas, port 80), service
- event-worker (Deployment), service
- postgres (StatefulSet), database
- postgres-data (PersistentVolumeClaim, 20Gi), storage
- tracking-config (ConfigMap), storage
- tracking-db (Secret), secret
Connections:
- tracking to tracking-api: api.parcelpoint.example
- tracking-api to tracking-config (dashed): reads
- tracking-api to tracking-db (dashed): reads
- event-worker to tracking-config (dashed): reads
- event-worker to tracking-db (dashed): reads
- postgres to postgres-data: mounts</desc><metadata data-format="buun-diagram"># Generated by plotwork generate from the source cluster (kubernetes: k8s).
# The next run writes over this file. Put changes in docs/cluster.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
flow "Parcelpoint on Kubernetes" direction=down desc="3 workloads and 4 objects around them, imported from Kubernetes manifests. Traffic flows from each Ingress to the pods behind its Services, and dashed arrows are configuration the pods read."

node tracking gateway "tracking" sub="Ingress, api.parcelpoint.example" icon=lucide:globe
node tracking_api service "tracking-api" sub="Deployment, 2 replicas, port 80"
node event_worker service "event-worker" sub="Deployment"
node postgres database "postgres" sub="StatefulSet" icon=simple:postgresql
node postgres_data storage "postgres-data" sub="PersistentVolumeClaim, 20Gi" icon=lucide:hard-drive
node tracking_config storage "tracking-config" sub="ConfigMap" icon=lucide:settings-2
node tracking_db secret "tracking-db" sub="Secret" icon=lucide:key-round

tracking -&gt; tracking_api : "api.parcelpoint.example"
tracking_api --&gt; tracking_config : "reads"
tracking_api --&gt; tracking_db : "reads"
event_worker --&gt; tracking_config : "reads"
event_worker --&gt; tracking_db : "reads"
postgres -&gt; postgres_data : "mounts"
