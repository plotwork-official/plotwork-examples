<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 547 536" width="547" height="536" role="img" aria-labelledby="dg-title dg-desc" aria-description="Parcelpoint tracking API endpoints: file tree of 13 entries (3 folders, 10 files), 2 levels. The 10 endpoints of the Parcelpoint tracking API by tag (shipments, tracking, and webhooks), imported from its OpenAPI document." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="light"><title id="dg-title">Parcelpoint tracking API endpoints</title><desc id="dg-desc">Parcelpoint tracking API endpoints: file tree of 13 entries (3 folders, 10 files), 2 levels. The 10 endpoints of the Parcelpoint tracking API by tag (shipments, tracking, and webhooks), imported from its OpenAPI document.
- shipments/ (folder, 5 entries): Shipments and their labels
  - shipments/GET /shipments: List shipments
  - shipments/POST /shipments: Create a shipment
  - shipments/GET /shipments/{id}: Get a shipment
  - shipments/DELETE /shipments/{id}: Cancel a shipment
  - shipments/GET /shipments/{id}/label: Download the label PDF
- tracking/ (folder, 3 entries): Where a parcel is
  - tracking/GET /parcels/{code}: Track a parcel
  - tracking/GET /parcels/{code}/events: List a parcel's events
  - tracking/POST /carrier-events: Receive an event from a carrier
- webhooks/ (folder, 2 entries): Events sent to a merchant
  - webhooks/GET /webhooks: List webhooks
  - webhooks/POST /webhooks: Add a webhook</desc><metadata data-format="buun-diagram"># Generated by plotwork generate from the source api (openapi: api/openapi.json).
# The next run writes over this file. Put changes in docs/api.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
tree "Parcelpoint tracking API endpoints" counts=on desc="The 10 endpoints of the Parcelpoint tracking API by tag (shipments, tracking, and webhooks), imported from its OpenAPI document."

dir "shipments" note="Shipments and their labels" icon=lucide:tag {
  file "GET /shipments" note="List shipments" icon=lucide:route
  file "POST /shipments" note="Create a shipment" icon=lucide:route
  file "GET /shipments/{id}" note="Get a shipment" icon=lucide:route
  file "DELETE /shipments/{id}" note="Cancel a shipment" icon=lucide:route
  file "GET /shipments/{id}/label" note="Download the label PDF" icon=lucide:route
}
dir "tracking" note="Where a parcel is" icon=lucide:tag {
  file "GET /parcels/{code}" note="Track a parcel" icon=lucide:route
  file "GET /parcels/{code}/events" note="List a parcel's events" icon=lucide:route
  file "POST /carrier-events" note="Receive an event from a carrier" icon=lucide:route
}
dir "webhooks" note="Events sent to a merchant" icon=lucide:tag {
  file "GET /webhooks" note="List webhooks" icon=lucide:route
  file "POST /webhooks" note="Add a webhook" icon=lucide:route
}
