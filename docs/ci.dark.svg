781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-group-tab="job_generated"><path d="M25 145 A15 15 0 0 1 40 130 L286 130 L286 166 A8 8 0 0 1 278 174 L25 174 Z" fill="#1f1f25"/><g transform="translate(36 135) scale(0.67)" aria-hidden="true" fill="none" stroke="#9085e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g><text x="60" y="147.37" font-size="12" font-weight="600" fill="#f3f2ee" textLength="214.65" lengthAdjust="spacingAndGlyphs">Generated diagrams match their files</text><text x="36" y="164.37" font-size="12" font-weight="400" fill="#c3c2b7" textLength="144.05" lengthAdjust="spacingAndGlyphs">Calls plotwork-check.yml</text></g><g data-group-tab="job_diagrams"><path d="M332 145 A15 15 0 0 1 347 130 L630 130 L630 166 A8 8 0 0 1 622 174 L332 174 Z" fill="#1f1f25"/><g transform="translate(343 135) scale(0.67)" aria-hidden="true" fill="none" stroke="#9085e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g><text x="367" y="147.37" font-size="12" font-weight="600" fill="#f3f2ee" textLength="251.06" lengthAdjust="spacingAndGlyphs">Hand-written diagrams are valid and drawn</text><text x="343" y="164.37" font-size="12" font-weight="400" fill="#c3c2b7" textLength="76" lengthAdjust="spacingAndGlyphs">ubuntu-latest</text></g><g data-node="generated" data-type="step"><rect x="44" y="187" width="235" height="86" rx="12" fill="#1f1f1d" stroke="#3a3a37" stroke-width="1" filter="url(#dg-lift)"/><text x="60" y="216.73" font-size="13" font-weight="600" fill="#f3f2ee" textLength="202.58" lengthAdjust="spacingAndGlyphs">Generated diagrams match their</text><text x="60" y="234.73" font-size="13" font-weight="600" fill="#f3f2ee" textLength="26.69" lengthAdjust="spacingAndGlyphs">files</text><text x="60" y="253.37" font-size="12" font-weight="400" fill="#c3c2b7" textLength="144.05" lengthAdjust="spacingAndGlyphs">Calls plotwork-check.yml</text></g><g data-node="diagrams_1" data-type="step"><rect x="383" y="187" width="129" height="56" rx="12" fill="#1f1f1d" stroke="#3a3a37" stroke-width="1" filter="url(#dg-lift)"/><rect x="397" y="201" width="28" height="28" rx="8" fill="#40403c"/><g transform="translate(403 207) scale(0.67)" aria-hidden="true" fill="none" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></g><text x="435" y="219.73" font-size="13" font-weight="600" fill="#f3f2ee" textLength="60.66" lengthAdjust="spacingAndGlyphs">Checkout</text></g><g data-node="diagrams_2" data-type="step"><rect x="351" y="263" width="193" height="56" rx="12" fill="#1f1f1d" stroke="#3a3a37" stroke-width="1" filter="url(#dg-lift)"/><text x="367" y="295.73" font-size="13" font-weight="600" fill="#f3f2ee" textLength="160.91" lengthAdjust="spacingAndGlyphs">Plotwork official plotwork</text></g><g data-node="on" data-type="terminal"><rect x="220" y="24" width="170" height="36" rx="18" fill="#1f1f1d" stroke="#898781" stroke-width="1" filter="url(#dg-lift)"/><text x="305" y="46.73" font-size="13" font-weight="600" fill="#f3f2ee" text-anchor="middle" textLength="125.56" lengthAdjust="spacingAndGlyphs">Pull request or push</text></g></svg>