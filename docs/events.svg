<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 1158" width="342" height="1158" role="img" aria-labelledby="dg-title dg-desc" aria-description="Parcel events on RabbitMQ: 5 nodes, 4 connections. 3 applications and the 2 channels where they meet: an arrow into a channel sends to it, an arrow out of one receives from it, labelled with the messages. Imported from AsyncAPI." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="auto"><title id="dg-title">Parcel events on RabbitMQ</title><desc id="dg-desc">Parcel events on RabbitMQ: 5 nodes, 4 connections. 3 applications and the 2 channels where they meet: an arrow into a channel sends to it, an arrow out of one receives from it, labelled with the messages. Imported from AsyncAPI.
Nodes:
- Tracking API (Version 1.8.2), service
- Carrier event worker (Version 1.8.2), service
- Webhook sender (Version 1.3.0), service
- Messaging: AMQP broker (tracking-rabbitmq.tracking:5672)
  - carrier.scans, queue
- Messaging: AMQP broker
  - parcel.status (The new status of a parcel, once per change.), queue
Connections:
- carrier.scans to Carrier event worker: CarrierScan
- Carrier event worker to parcel.status: ParcelStatusChanged, ParcelDelivered
- Tracking API to carrier.scans: CarrierScan
- parcel.status to Webhook sender: ParcelStatusChanged, ParcelDelivered</desc><style>.dg-s0{fill:#f5ece6;stroke:#e09777}.dg-s1{fill:#f5ece6}.dg-s2{stroke:#ad502a}.dg-s3{fill:#171716}.dg-s4{fill:#52514e}.dg-s5{fill:#ffffff;stroke:#dad9d2;filter:url(#dg-lift)}.dg-s6{fill:#fdede7}.dg-s7{stroke:#df6331}.dg-s8{fill:#e5effa}.dg-s9{stroke:#2a78d6}.dg-s10{fill:#ffffff;stroke:#dad9d2}.dg-s11{stroke:#52514e}@media (prefers-color-scheme:dark){svg:not([data-scheme="light"]) .dg-s0{fill:#251c17;stroke:#965032}svg:not([data-scheme="light"]) .dg-s1{fill:#251c17}svg:not([data-scheme="light"]) .dg-s2{stroke:#da6130}svg:not([data-scheme="light"]) .dg-s3{fill:#f3f2ee}svg:not([data-scheme="light"]) .dg-s4{fill:#c3c2b7}svg:not([data-scheme="light"]) .dg-s5{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg:not([data-scheme="light"]) .dg-s6{fill:#442b1f}svg:not([data-scheme="light"]) .dg-s7{stroke:#d95926}svg:not([data-scheme="light"]) .dg-s8{fill:#243445}svg:not([data-scheme="light"]) .dg-s9{stroke:#3987e5}svg:not([data-scheme="light"]) .dg-s10{fill:#1f1f1d;stroke:#3a3a37}svg:not([data-scheme="light"]) .dg-s11{stroke:#c3c2b7}}svg[data-scheme="dark"] .dg-s0{fill:#251c17;stroke:#965032}svg[data-scheme="dark"] .dg-s1{fill:#251c17}svg[data-scheme="dark"] .dg-s2{stroke:#da6130}svg[data-scheme="dark"] .dg-s3{fill:#f3f2ee}svg[data-scheme="dark"] .dg-s4{fill:#c3c2b7}svg[data-scheme="dark"] .dg-s5{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg[data-scheme="dark"] .dg-s6{fill:#442b1f}svg[data-scheme="dark"] .dg-s7{stroke:#d95926}svg[data-scheme="dark"] .dg-s8{fill:#243445}svg[data-scheme="dark"] .dg-s9{stroke:#3987e5}svg[data-scheme="dark"] .dg-s10{fill:#1f1f1d;stroke:#3a3a37}svg[data-scheme="dark"] .dg-s11{stroke:#c3c2b7}</style><metadata data-format="buun-diagram"># Generated by plotwork generate from the source events (asyncapi: events).
# The next run writes over this file. Put changes in docs/events.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
flow "Parcel events on RabbitMQ" direction=down desc="3 applications and the 2 channels where they meet: an arrow into a channel sends to it, an arrow out of one receives from it, labelled with the messages. Imported from AsyncAPI."

node tracking_api service "Tracking API" sub="Version 1.8.2"
node carrier_event_worker service "Carrier event worker" sub="Version 1.8.2"
node webhook_sender service "Webhook sender" sub="Version 1.3.0"

group amqp "AMQP broker" type=messaging sub="tracking-rabbitmq.tracking:5672" {
  node carrier_scans queue "carrier.scans"
}

group amqp_2 "AMQP broker" type=messaging {
  node parcel_status queue "parcel.status" sub="The new status of a parcel, once per change."
}

carrier_scans -&gt; carrier_event_worker : "CarrierScan" icon=lucide:inbox
carrier_event_worker -&gt; parcel_status : "ParcelStatusChanged, ParcelDelivered" icon=lucide:send
tracking_api -&gt; carrier_scans : "CarrierScan" icon=lucide:send
parcel_status -&gt; webhook_sender : "ParcelStatusChanged, ParcelDelivered" icon=lucide:inbox
