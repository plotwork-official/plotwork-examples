# Makes every generated diagram again, nightly and on each push to main, and opens or edits one pull request when a
# file changed under it. When nothing drifted, it closes the pull request it opened before and deletes its branch.

name: regenerate

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the pull request branch
      pull-requests: write # open, edit, or close the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: plotwork-official/plotwork-action@f1bb2403552880c8dd9c0f2c5ed213b36c3c9390 # v1.7.0
        with:
          command: generate
          mode: write
          on-drift: pr
          pr-branch: plotwork/diagrams
