# Fails a pull request whose generated diagrams no longer match the files they are made from, or whose hand-written
# diagrams have an error or a stale picture. Nothing is written and no token is used.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # The reusable check workflow other repositories call, run here on this repository: it is tested on every change.
  generated:
    name: Generated diagrams match their files
    uses: ./.github/workflows/plotwork-check.yml
    permissions:
      contents: read

  diagrams:
    name: Hand-written diagrams are valid and drawn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: plotwork-official/plotwork-action@877be568308545bc11529b6b4e607374d051f4e4 # v1.3.0
        with:
          command: check
          paths: |
            **/*.md
          diagrams: |
            diagrams/**/*.diagram
