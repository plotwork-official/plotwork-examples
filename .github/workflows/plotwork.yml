# A reusable workflow for diagrams as code, for a platform team to call from every repository:
#
#   jobs:
#     diagrams:
#       uses: plotwork-official/plotwork-examples/.github/workflows/plotwork.yml@<commit SHA>
#       with:
#         mode: check
#       permissions:
#         contents: read
#
# What each mode asks of the caller, which a called workflow can never exceed:
#
#   mode    code-scanning   permissions the caller grants
#   check   false           contents: read
#   check   true            contents: read, security-events: write
#   write   (ignored)       contents: write, pull-requests: write
#
# Check mode needs read access only and makes no network request, so it is safe on a pull request from a fork. Write mode runs
# on a push or a schedule, never on a fork's pull request. Publishing reads the secret PLOTWORK_API_KEY, which the caller passes
# with secrets: inherit or by name. This repository's own check.yml calls it.

name: plotwork

on:
  workflow_call:
    inputs:
      mode:
        description: check fails on drift and writes nothing; write makes the diagrams again and opens or edits a pull request.
        type: string
        default: check
      working-directory:
        description: The folder of the team's settings file, relative to the repository root.
        type: string
        default: '.'
      config:
        description: The settings file, relative to working-directory. Empty finds plotwork.config.json.
        type: string
        default: ''
      changed-only:
        description: On a pull request, check only the sources whose files the pull request changes.
        type: boolean
        default: false
      code-scanning:
        description: In check mode, upload drift and problems as code scanning alerts. Needs security-events write from the caller.
        type: boolean
        default: false
      publish:
        description: In write mode, publish the sources that have a publish section with the secret PLOTWORK_API_KEY.
        type: boolean
        default: false
      api-url:
        description: The Plotwork API the key belongs to. Empty is the hosted one.
        type: string
        default: ''
    secrets:
      PLOTWORK_API_KEY:
        required: false

permissions: {}

jobs:
  check:
    name: Diagrams match their files
    if: inputs.mode == 'check' && !inputs.code-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: plotwork-check-${{ github.ref }}-${{ inputs.working-directory }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.changed-only && 0 || 1 }}
      - uses: plotwork-official/plotwork-action@ba9f574c983876c9a51d1167db10ff7685e1fc22 # v1.0.0-beta.2
        with:
          command: generate
          working-directory: ${{ inputs.working-directory }}
          config: ${{ inputs.config }}
          since: ${{ inputs.changed-only && github.event.pull_request.base.sha || '' }}

  check-and-scan:
    name: Diagrams match their files, with code scanning
    if: inputs.mode == 'check' && inputs.code-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF report
    concurrency:
      group: plotwork-check-${{ github.ref }}-${{ inputs.working-directory }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.changed-only && 0 || 1 }}
      - id: plotwork
        uses: plotwork-official/plotwork-action@ba9f574c983876c9a51d1167db10ff7685e1fc22 # v1.0.0-beta.2
        with:
          command: generate
          working-directory: ${{ inputs.working-directory }}
          config: ${{ inputs.config }}
          since: ${{ inputs.changed-only && github.event.pull_request.base.sha || '' }}
          sarif-file: plotwork.sarif
      # Uploaded whether or not the check passed, so a fixed diagram closes its alert.
      - if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ inputs.working-directory }}/plotwork.sarif
          category: plotwork-${{ inputs.working-directory }}

  write:
    name: Regenerate and open a pull request
    if: inputs.mode == 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the pull request branch
      pull-requests: write # open, edit, or close the pull request
    # Never cancelled: a run that is pushing finishes, and the next one starts from what it pushed.
    concurrency:
      group: plotwork-write-${{ github.ref }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: plotwork-official/plotwork-action@ba9f574c983876c9a51d1167db10ff7685e1fc22 # v1.0.0-beta.2
        with:
          command: generate
          mode: write
          working-directory: ${{ inputs.working-directory }}
          config: ${{ inputs.config }}
          publish: ${{ inputs.publish }}
        env:
          PLOTWORK_API_KEY: ${{ secrets.PLOTWORK_API_KEY }}
          PLOTWORK_API_URL: ${{ inputs.api-url }}
